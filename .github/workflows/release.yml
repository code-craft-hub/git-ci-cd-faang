name: Release

# Runs after CI succeeds on main — never releases code that hasn't passed
# the full quality gate. semantic-release then inspects conventional commits
# since the last release to decide whether/how to bump the version.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write # to push the version-bump commit, CHANGELOG, and tag
  issues: write # semantic-release comments on related issues
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Disable husky's git hooks for this workflow. semantic-release's git
  # plugin commits CHANGELOG.md/package.json on our behalf, and that commit
  # message (auto-generated, can include long footer lines/links) isn't
  # bound by the same commitlint rules a human-authored commit is. CI
  # already enforces lint/format/tests as their own jobs, so the local
  # pre-commit/commit-msg hooks add no extra safety here — only friction.
  # https://typicode.github.io/husky/how-to.html#ci-server-and-docker
  HUSKY: "0"

jobs:
  release:
    name: semantic-release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
